  title: "MATE-CLIP: Multimodal Adaptation and Temporal Enhancement for Action Recognition"
  framework_name: "MATE-CLIP"
  modules:
    - name: "AMTF"
      full: "Adaptive Multi-Strategy Text Fusion"
      code_path: "Vita-CLIP/training/Text_MSTFF.py"
      design_note: "applied on a learnable branch alongside a static semantic branch"
    - name: "MGTA"
      full: "Motion-Guided Temporal Adapter"
      code_path: "Vita-CLIP/training/VitaCLIP_discriminative_rap.py"
    - name: "BFEM"
      full: "Bidirectional Feature Enhancement Module"
      code_path: "Vita-CLIP/training/BIE.py"
  source_code: "Vita-CLIP/ (based on Vita-CLIP, CVPR 2023)"
  base_paper: "Vita-CLIP: Video and text adaptive CLIP via Multiscale Temporal Modeling (CVPR 2023)"
